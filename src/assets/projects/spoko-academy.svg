  <rect x="324" y="270" width="480" height="172" rx="14" fill="#111115" stroke="#D4AF37" stroke-opacity="0.25"/>
  <path d="M356 394 C415 386, 445 330, 505 338 C565 346, 610 296, 675 304 C720 310, 745 292, 774 286"
        stroke="url(#sa-gold)" stroke-width="3.5" stroke-linecap="round"/>
