  <circle cx="675" cy="304" r="6" fill="#F2D68A"/>
  <circle cx="774" cy="286" r="6" fill="#E02035"/>
  <line x1="356" y1="412" x2="774" y2="412" stroke="#FFFFFF" stroke-opacity="0.1"/>
