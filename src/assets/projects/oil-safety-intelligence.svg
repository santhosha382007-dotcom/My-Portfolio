<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <defs>
    <radialGradient id="os-bg" cx="50%" cy="50%" r="68%">
      <stop offset="0%" stop-color="#1E100C"/>
      <stop offset="52%" stop-color="#0C0A0C"/>
      <stop offset="100%" stop-color="#070708"/>
    </radialGradient>
    <radialGradient id="os-gold-glow" cx="50%" cy="48%" r="36%">
      <stop offset="0%" stop-color="#F2D68A" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="os-crimson" cx="76%" cy="32%" r="38%">
      <stop offset="0%" stop-color="#E02035" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="os-gold" x1="360" y1="100" x2="600" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2D68A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A691B"/>
    </linearGradient>
    <pattern id="os-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" stroke="#D4AF37" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#os-bg)"/>
  <rect width="960" height="540" fill="url(#os-grid)"/>
  <rect width="960" height="540" fill="url(#os-gold-glow)"/>
  <rect width="960" height="540" fill="url(#os-crimson)"/>

  <!-- Sensor telemetry rings -->
  <circle cx="480" cy="270" r="205" stroke="#D4AF37" stroke-opacity="0.14" stroke-dasharray="6 10"/>
  <circle cx="480" cy="270" r="154" stroke="#E02035" stroke-opacity="0.32" stroke-width="1.8" stroke-dasharray="28 12"/>
  <circle cx="480" cy="270" r="112" stroke="url(#os-gold)" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Left & right diagnostic signal conduits -->
  <g stroke="url(#os-gold)" stroke-opacity="0.38" stroke-width="1.8" stroke-linecap="round">
    <path d="M90 190 H265 L325 240"/>
    <path d="M90 350 H265 L325 300"/>
    <path d="M870 190 H695 L635 240"/>
    <path d="M870 350 H695 L635 300"/>
  </g>
  <g fill="#F2D68A">
    <circle cx="90" cy="190" r="4"/>
    <circle cx="90" cy="350" r="4"/>
    <circle cx="870" cy="190" r="4"/>
    <circle cx="870" cy="350" r="4"/>
  </g>

  <!-- Central Geometric Droplet & Intelligence Core -->
  <path d="M480 124 C480 124 558 228 558 292 C558 338 523 374 480 374 C437 374 402 338 402 292 C402 228 480 124 480 124 Z"
        fill="#121114" stroke="url(#os-gold)" stroke-width="3"/>
  <path d="M480 158 C480 158 534 236 534 288 C534 320 510 346 480 346 C450 346 426 320 426 288 C426 236 480 158 480 158 Z"
        fill="#1A140E" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Inner AI safety pulse waveform -->
  <path d="M432 288 H452 L464 256 L478 314 L492 272 L504 288 H528"
        stroke="#E02035" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="480" cy="222" r="6" fill="#F2D68A"/>

  <!-- Abstract telemetry cards -->
  <rect x="78" y="232" width="146" height="76" rx="12" fill="#111114" fill-opacity="0.86" stroke="#D4AF37" stroke-opacity="0.35"/>
  <rect x="98" y="254" width="66" height="7" rx="3.5" fill="#F2D68A" fill-opacity="0.8"/>
  <rect x="98" y="272" width="104" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.16"/>
  <rect x="98" y="286" width="80" height="6" rx="3" fill="#D4AF37" fill-opacity="0.45"/>

  <rect x="736" y="232" width="146" height="76" rx="12" fill="#111114" fill-opacity="0.86" stroke="#E02035" stroke-opacity="0.45"/>
  <rect x="756" y="254" width="54" height="7" rx="3.5" fill="#E02035" fill-opacity="0.9"/>
  <rect x="756" y="272" width="104" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.16"/>
  <rect x="756" y="286" width="76" height="6" rx="3" fill="#F2D68A" fill-opacity="0.55"/>
</svg>
